<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef2fb"/><stop offset=".30" stop-color="#d2dff5"/><stop offset=".48" stop-color="#578aff"/><stop offset=".65" stop-color="#173fbd"/><stop offset=".82" stop-color="#97d9fc"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#fff"/><stop offset=".35" stop-color="#dcf4ff"/><stop offset=".65" stop-color="#fff"/><stop offset="1" stop-color="#dfecff"/>
    </linearGradient>
    <filter id="diffuse" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="edge" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1600" height="820" fill="#fff"/>
  <g transform="rotate(-23 800 350)" fill="none">
    <ellipse cx="850" cy="280" rx="920" ry="280" stroke="#547fd9" stroke-width="140" opacity=".19" filter="url(#diffuse)"/>
    <ellipse cx="850" cy="280" rx="920" ry="280" stroke="url(#rim)" stroke-width="92" filter="url(#edge)"/>
    <ellipse cx="850" cy="270" rx="916" ry="252" stroke="url(#light)" stroke-width="36" filter="url(#edge)"/>
    <ellipse cx="850" cy="264" rx="916" ry="237" stroke="#fff" stroke-width="5" opacity=".88" filter="url(#edge)"/>
  </g>
  <rect width="1600" height="820" filter="url(#grain)" opacity=".035" style="mix-blend-mode:multiply"/>
</svg>
